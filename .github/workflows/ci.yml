name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sgomez
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sgomez/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Builds the app and starts `next start` through Playwright's webServer.
      - name: End-to-end tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: sgomez/playwright-report
          retention-days: 7

      # Ubuntu 24.04 blocks unprivileged user namespaces, and Chromium aborts
      # with "No usable sandbox!" without this. Same fix as claude-skills' CI.
      - name: Allow Chromium's sandbox (AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # LCP is an error here (lighthouserc.ci.json); locally it is a warning
      # because antivirus SSL filtering distorts it.
      - name: Lighthouse budgets
        run: |
          export CHROME_PATH="$(node -e 'console.log(require("@playwright/test").chromium.executablePath())')"
          npx next start -p 3000 &
          for i in $(seq 1 60); do curl -fs http://localhost:3000/ >/dev/null && break; sleep 1; done
          npx lhci autorun --config=./lighthouserc.ci.json
