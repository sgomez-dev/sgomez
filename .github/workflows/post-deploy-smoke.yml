name: Post-deploy smoke

# Comprueba con curl las cabeceras de producción después de cada despliegue de Cloudflare.
# Lo que vigila (el Vary del HTML prerenderizado, el índice de /api, el catálogo
# RFC 9727, la cabecera Link y el JSON-LD) depende de la capa de hosting, así que
# ni vitest ni el e2e con next start pueden verlo.
#
# Workers Builds publica en cada commit un check run cuyo nombre empieza por
# "Workers Builds"; cuando termina bien en main, el despliegue ya está servido.
on:
  check_run:
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.check_run.name, 'Workers Builds') &&
       github.event.check_run.conclusion == 'success' &&
       github.event.check_run.check_suite.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: sgomez/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Headers of production
        run: node sgomez/scripts/post-deploy-smoke.mjs https://sgomez.dev
